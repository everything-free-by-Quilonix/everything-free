name: Bug report
description: Something on the site is broken
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For problems with the site itself. If a **resource listing** is inaccurate, use the "Correct a resource" template instead.

        For security issues, please do not use this form — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /resources
        2. Tick "Open source"
        3. …
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11 / Safari on iPhone 15
    validations:
      required: false

  - type: checkboxes
    id: accessibility
    attributes:
      label: Accessibility
      options:
        - label: This is an accessibility problem (keyboard, screen reader, contrast, zoom, reduced motion)
          required: false
