name: Correct a resource
description: Report a broken link, a changed free plan, or incorrect information
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections are the most valuable contribution to this library. A wrong entry is worse than a missing one, because someone will act on it.

  - type: input
    id: resource
    attributes:
      label: Resource
      description: The identifier from the page URL, e.g. `gimp` from /resources/gimp
      placeholder: gimp
    validations:
      required: true

  - type: dropdown
    id: reason
    attributes:
      label: What is wrong?
      options:
        - BROKEN_LINK — the link is dead or redirects somewhere unexpected
        - NO_LONGER_FREE — there is no longer any free way to use it
        - PRICING_CHANGED — the free plan or its limits have changed
        - INCORRECT_INFORMATION — something on the page is wrong
        - WRONG_CATEGORY — it is filed in the wrong place
        - DUPLICATE — it is listed twice
        - SUGGEST_ALTERNATIVE — I want to suggest a related resource
        - OTHER
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should it say instead? Specifics make a report actionable.
    validations:
      required: true

  - type: input
    id: evidence
    attributes:
      label: Evidence URL
      description: A link that backs this up — a pricing page, changelog or announcement.
      placeholder: https://
    validations:
      required: false
