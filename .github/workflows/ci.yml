name: CI

# Runs on GitHub's free runners for public repositories.
#
# The build is the important step, not a formality: all the data-integrity rules —
# a conditional free status with no documented limitations, a VERIFIED claim without
# evidence, a dangling cross-reference, a tool whose privacy declaration contradicts
# itself — are enforced at build time. A pull request that would publish a dishonest
# listing fails here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing in CI needs write access.
permissions:
  contents: read

concurrency:
  # A superseded run on the same branch is wasted runner time.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types and data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: installs exactly the lockfile, so CI
      # cannot pass against a different dependency tree than the one committed.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Node's built-in test runner against the TypeScript source — no test
      # dependency. Covers fact-level evidence, the confirmed-only filters and the
      # rules that make impossible evidence states fail the build.
      - name: Unit tests
        run: npm test

      - name: Build (includes all data validation)
        run: npm run build

      # This is the architectural assertion, not a second formality: `output: export`
      # refuses to build if any route needs a server — a server action, an API route,
      # per-request rendering. If this step passes, the application provably has no
      # runtime, which is what the zero-cost guarantee depends on. A change that
      # reintroduces a server requirement fails here instead of quietly acquiring a
      # hosting bill.
      - name: Static export (proves every route is static)
        run: npm run build:static

      # The two failures that matter most are invisible to file checks: a wrong CSP
      # hash silently disables all interactivity, and a wrong base path 404s every
      # asset while the HTML still looks fine. Only a real page load catches either.
      # Uses the Chrome preinstalled on GitHub's Ubuntu runners — nothing downloaded.
      - name: Browser smoke test (served exactly as the static host serves it)
        run: npm run test:browser -- --report browser-report.txt

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: browser-report.txt
          if-no-files-found: ignore

      - name: Verification backlog matches the data
        # docs/verification-backlog.md is generated from the resource data. A change
        # to verification data that does not regenerate it fails here, so the
        # maintainer work queue can never disagree with what the site shows.
        run: npm run backlog:check

      - name: Report verification backlog
        # Informational. Keeps the size of the manual verification queue visible on
        # every run rather than only in the monthly scheduled job.
        run: npm run check:verification
